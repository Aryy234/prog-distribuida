# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always

    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: modelo-db

    ports:
      - "5432:5432"

  adminer:
      image: adminer
      restart: always
      ports:
        - 9080:9080